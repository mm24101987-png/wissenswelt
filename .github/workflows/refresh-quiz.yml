name: Refresh quiz questions
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch current German quiz questions
        run: node scripts/update-questions.mjs
      - name: Commit updated question bank
        run: |
          if git diff --quiet -- random-questions.json; then
            echo "No question changes"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add random-questions.json
            git commit -m "Refresh online quiz questions"
            git push
          fi
